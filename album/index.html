<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
 margin:0;
 font-family:sans-serif;
 background:linear-gradient(180deg,#0b3d2e,#021e16);
 color:white;
}

/* HEADER */
.header{
 display:flex;
 align-items:center;
 padding:12px;
 background:#021e16;
 border-bottom:2px solid #00e676;
 font-weight:bold;
 cursor:pointer;
}

/* BOTONES */
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 padding:10px;
}

button{
 background:#00e676;
 border:none;
 padding:8px 12px;
 border-radius:6px;
 color:#003d2e;
 font-weight:bold;
 cursor:pointer;
}

button:hover{
 transform:scale(1.05);
}

/* GRUPOS */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
 padding:10px;
}

.card{
 background:#063d2e;
 padding:10px;
 border-radius:10px;
}

/* DETALLE */
.group-row{
 display:flex;
 gap:20px;
 flex-wrap:wrap;
 padding:10px;
}

.team-box{
 background:#063d2e;
 padding:10px;
 border-radius:10px;
 min-width:180px;
}

.sticker{
 display:flex;
 justify-content:space-between;
 padding:3px;
 border-radius:5px;
}

.sticker.owned{
 background:#00e67633;
}

input{
 width:40px;
}

</style>
</head>

<body>

<div class="header" onclick="goHome()">⚽ Mundial 2026</div>

<div id="auth" style="padding:10px;">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<div id="app" style="display:none">

<div class="actions">
<button onclick="buscar()">🔎 Buscar</button>
<button onclick="showMissing()">📋 Me faltan</button>
<button onclick="cambiarFiguritas()">🔄 Cambiar figuritas</button>
<button onclick="compareWithUser()">🤝 Comparar</button>
<button onclick="loadRanking()">🏆 Global</button>
<button onclick="rankingFriends()">🏆 Amigos</button>
<button onclick="searchUser()">👥 Agregar</button>
<button onclick="loadRequests()">📥 Solicitudes</button>
<button onclick="loadFriends()">👥 Lista amigos</button>
</div>

<div id="groups" class="grid"></div>
<div id="detail"></div>

</div>

<script>

let userId=null;
let progressData={};

const groups={
 "Grupo A":["MEX","KOR","RSA","CZE"],
 "Grupo B":["CAN","SUI","QAT","BIH"],
 "Grupo C":["BRA","MAR","SCO","HAI"],
 "Grupo D":["USA","AUS","PAR","TUR"],
 "Grupo E":["GER","ECU","CIV","CUW"],
 "Grupo F":["NED","JPN","TUN","SWE"],
 "Grupo G":["BEL","IRN","EGY","NZL"],
 "Grupo H":["CPV","KSA","ESP","URU"],
 "Grupo I":["FRA","SEN","NOR","IRQ"],
 "Grupo J":["ALG","ARG","AUT","JOR"],
 "Grupo K":["POR","COL","UZB","COD"],
 "Grupo L":["ENG","CRO","PAN","GHA"],
 "Extras":["FWC","CC"]
};

function generate(code){
 if(code==="FWC") return Array.from({length:19},(_,i)=>"FWC-"+(i+1));
 if(code==="CC") return Array.from({length:14},(_,i)=>"CC-"+(i+1));
 return Array.from({length:20},(_,i)=>code+"-"+(i+1));
}

function goHome(){
 document.getElementById("detail").innerHTML="";
}

async function load(){
 let r=await fetch('/progress/'+userId);
 let data=await r.json();

 progressData={};
 data.forEach(x=>{
  progressData[x.sticker]={
   owned:x.owned,
   qty:x.qty
  };
 });
}

function render(){

 let g=document.getElementById("groups");
 g.innerHTML="";

 for(let k in groups){

  let all=[];
  groups[k].forEach(t=>all.push(...generate(t)));

  let owned=all.filter(s=>progressData[s]?.owned).length;

  g.innerHTML+=`
  <div class="card">
   <h3>${k}</h3>
   <p>${owned}/${all.length}</p>
   <button onclick="openGroup('${k}')">Entrar</button>
  </div>`;
 }
}

function openGroup(g){

 let d=document.getElementById("detail");
 d.innerHTML=`<h2>${g}</h2>`;

 let row=document.createElement("div");
 row.className="group-row";

 groups[g].forEach(t=>{

  let box=document.createElement("div");
  box.className="team-box";

  generate(t).forEach(s=>{

   let data=progressData[s] || {owned:0,qty:0};

   let item=document.createElement("div");
   item.className="sticker "+(data.owned?"owned":"");

   item.innerHTML=`
    ${s}
    <select onchange="setVal('${s}',this.value)">
      <option ${!data.owned?"selected":""}>NO</option>
      <option ${data.owned?"selected":""}>SI</option>
    </select>
    <input type="number" min="0" value="${data.qty}"
      ${!data.owned?"disabled":""}
      onchange="setQty('${s}',this.value)">
   `;

   box.appendChild(item);
  });

  row.appendChild(box);
 });

 d.appendChild(row);
}

async function setVal(s,v){

 let data=progressData[s] || {qty:0};
 data.owned = v==="SI"?1:0;
 if(!data.owned) data.qty=0;

 progressData[s]=data;

 await save(s);
 render();
}

async function setQty(s,v){

 let data=progressData[s];
 data.qty=parseInt(v)||0;

 await save(s);
}

async function save(s){
 await fetch('/progress',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
   user_id:userId,
   sticker:s,
   owned:progressData[s].owned,
   qty:progressData[s].qty
  })
 });
}

/* ================= FUNCIONES EXTRA ================= */

function buscar(){
 const q=prompt("Buscar");
 if(!q)return;

 let search=q.toLowerCase();

 for(let g in groups){
  for(let t of groups[g]){
   if(t.toLowerCase().includes(search)){
    openGroup(g);
    return;
   }
  }
 }

 if(search.includes("fifa")||search.includes("coca")){
  openGroup("Extras");
 }
}

function showMissing(){
 let d=document.getElementById("detail");
 d.innerHTML="<h2>Te faltan</h2>";

 for(let g in groups){
  let row=document.createElement("div");
  row.className="group-row";

  groups[g].forEach(t=>{
   let list=generate(t).filter(s=>!progressData[s]?.owned);

   if(list.length){
    let box=document.createElement("div");
    box.className="team-box";
    box.innerHTML=`<h4>${t}</h4>`;
    list.forEach(s=>box.innerHTML+=`<div>${s}</div>`);
    row.appendChild(box);
   }
  });

  d.appendChild(row);
 }
}

async function cambiarFiguritas(){

 let resFriends = await fetch('/friends/'+userId);
 let friends = await resFriends.json();

 let myDup = Object.entries(progressData)
   .filter(([k,v])=>v.qty>1)
   .map(([k])=>k);

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Cambios posibles</h2>";

 for(let f of friends){

  let r = await fetch('/progress/'+f.id);
  let data = await r.json();

  let friendData={};
  data.forEach(x=>friendData[x.sticker]=x);

  let matches = myDup.filter(s => friendData[s]?.owned);

  if(matches.length){
    d.innerHTML+=`<h3>${f.username}</h3>`;
    matches.forEach(s=>d.innerHTML+=`<div>${s}</div>`);
  }
 }
}

/* ================= AUTH ================= */

async function register(){
 await fetch('/register',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({username:user.value,password:pass.value})
 });
 alert("Usuario creado");
}

async function login(){

 let r=await fetch('/login',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({username:user.value,password:pass.value})
 });

 if(!r.ok){
  alert("Error login");
  return;
 }

 let data=await r.json();
 userId=data.id;

 document.getElementById("auth").style.display="none";
 document.getElementById("app").style.display="block";

 await load();
 render();
}

</script>

</body>
</html>
