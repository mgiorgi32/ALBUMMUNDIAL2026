<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:sans-serif;background:#0b3d2e;color:white}

.header{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 background:#06281f;
 cursor:pointer;
}

.container{padding:10px}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
}

.card{
 background:#145a32;
 padding:10px;
 border-radius:10px;
}

button{
 padding:6px;
 border:none;
 background:#00c853;
 color:white;
 border-radius:5px;
 cursor:pointer;
 margin:3px;
}

.group-row{
 display:flex;
 gap:20px;
 flex-wrap:wrap;
 margin-bottom:20px;
}

.team-box{
 min-width:180px;
 background:#145a32;
 padding:10px;
 border-radius:10px;
}

.sticker{
 display:flex;
 justify-content:space-between;
 margin:2px 0;
}
</style>
</head>

<body>

<div class="header" onclick="goHome()">⚽ Mundial 2026</div>

<div class="container">

<div id="auth">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<div id="app" style="display:none">

<div>
<button onclick="showMissing()">📋 Me faltan</button>
<button onclick="copyMissing()">📤 Copiar</button>
<button onclick="compareWithUser()">🤝 Comparar</button>
<button onclick="loadRanking()">🏆 Global</button>

<button onclick="searchUser()">🔎 Buscar</button>
<button onclick="loadRequests()">📥 Solicitudes</button>
<button onclick="loadFriends()">👥 Amigos</button>
<button onclick="rankingFriends()">🏆 Amigos</button>
</div>

<div id="stats"></div>

<div id="groups" class="grid"></div>
<div id="detail"></div>

</div>

</div>

<script>

let userId=null;
let progressData={};

const groups={
 "Grupo A":["MEX","KOR","RSA","CZE"],
 "Grupo B":["CAN","SUI","QAT","BIH"],
 "Grupo C":["BRA","MAR","SCO","HAI"],
 "Grupo D":["USA","AUS","PAR","TUR"],
 "Grupo E":["GER","ECU","CIV","CUW"],
 "Grupo F":["NED","JPN","TUN","SWE"],
 "Grupo G":["BEL","IRN","EGY","NZL"],
 "Grupo H":["CPV","KSA","ESP","URU"],
 "Grupo I":["FRA","SEN","NOR","IRQ"],
 "Grupo J":["ALG","ARG","AUT","JOR"],
 "Grupo K":["POR","COL","UZB","COD"],
 "Grupo L":["ENG","CRO","PAN","GHA"],
 "Extras":["FWC","CC"]
};

function generate(code){
 if(code==="FWC") return Array.from({length:19},(_,i)=>"FWC-"+(i+1));
 if(code==="CC") return Array.from({length:14},(_,i)=>"CC-"+(i+1));
 return Array.from({length:20},(_,i)=>code+"-"+(i+1));
}

function goHome(){
 document.getElementById("detail").innerHTML="";
}

async function load(){
 let r=await fetch('/progress/'+userId);
 let data=await r.json();
 progressData={};
 data.forEach(x=>progressData[x.sticker]=x.owned);
}

function render(){

 let g=document.getElementById("groups");
 g.innerHTML="";

 let total=0,have=0;

 for(let k in groups){

  let all=[];
  groups[k].forEach(t=>all.push(...generate(t)));

  let owned=all.filter(s=>progressData[s]).length;

  total+=all.length;
  have+=owned;

  g.innerHTML+=`
  <div class="card">
   <h3>${k}</h3>
   <p>${owned}/${all.length}</p>
   <button onclick="openGroup('${k}')">Entrar</button>
  </div>`;
 }

 document.getElementById("stats").innerText=`Total: ${have}/${total}`;
}

function openGroup(g){

 let d=document.getElementById("detail");
 d.innerHTML=`<h2>${g}</h2>`;

 let row=document.createElement("div");
 row.className="group-row";

 groups[g].forEach(t=>{

  let stickers=generate(t);
  let owned=stickers.filter(s=>progressData[s]).length;

  let box=document.createElement("div");
  box.className="team-box";

  box.innerHTML=`<h4>${t} (${owned}/20)</h4>`;

  stickers.forEach(s=>{
   let val=progressData[s]?1:0;

   let item=document.createElement("div");
   item.className="sticker";

   item.innerHTML=`
    <span>${s}</span>
    <select onchange="setVal('${s}',this.value)">
      <option ${val==0?"selected":""}>NO</option>
      <option ${val==1?"selected":""}>SI</option>
    </select>
   `;

   box.appendChild(item);
  });

  row.appendChild(box);
 });

 d.appendChild(row);
}

async function setVal(s,v){
 let val=v==="SI"?1:0;
 progressData[s]=val;

 await fetch('/progress',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({user_id:userId,sticker:s,owned:val})
 });

 render();
}

function showMissing(){

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Te faltan</h2>";

 for(let g in groups){

  let row=document.createElement("div");
  row.className="group-row";

  groups[g].forEach(t=>{

   let list=generate(t).filter(s=>!progressData[s]);

   if(list.length){
    let box=document.createElement("div");
    box.className="team-box";

    box.innerHTML=`<h4>${t}</h4>`;

    list.forEach(s=>{
      let item=document.createElement("div");
      item.className="sticker";
      item.innerText=s;
      box.appendChild(item);
    });

    row.appendChild(box);
   }
  });

  d.appendChild(row);
 }
}

function copyMissing(){
 let list=[];

 for(let g in groups){
  groups[g].forEach(t=>{
    generate(t).forEach(s=>{
      if(!progressData[s]) list.push(s);
    });
  });
 }

 navigator.clipboard.writeText(list.join("\\n"));
 alert("Copiado");
}

async function compareWithUser(){

 const other = prompt("Username");
 if(!other) return;

 const res = await fetch('/progress-user/'+other);
 if(!res.ok){
  alert("Usuario no existe");
  return;
 }

 const data = await res.json();

 let otherData={};
 data.forEach(x=>otherData[x.sticker]=x.owned);

 let need=[],give=[];

 for(let g in groups){
  groups[g].forEach(t=>{
    generate(t).forEach(s=>{
      if(!progressData[s] && otherData[s]) need.push(s);
      if(progressData[s] && !otherData[s]) give.push(s);
    });
  });
 }

 let d=document.getElementById("detail");

 d.innerHTML=`
 <h2>Comparación</h2>

 <h3>Vos no tenés y él sí</h3>
 ${need.map(s=>`<div>${s}</div>`).join("")}

 <h3>Él no tiene y vos sí</h3>
 ${give.map(s=>`<div>${s}</div>`).join("")}
 `;
}

// ================= AMIGOS =================

async function searchUser(){

 const name = prompt("Buscar usuario");
 if(!name) return;

 const res = await fetch('/search/'+name);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Resultados</h2>";

 data.forEach(u=>{
  d.innerHTML+=`
  <div>
   ${u.username}
   <button onclick="addFriend(${u.id})">Agregar</button>
  </div>`;
 });
}

async function addFriend(id){
 await fetch('/add-friend',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({user_id:userId,friend_id:id})
 });
 alert("Solicitud enviada");
}

async function loadRequests(){

 const res = await fetch('/requests/'+userId);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Solicitudes</h2>";

 data.forEach(r=>{
  d.innerHTML+=`
  <div>
   ${r.username}
   <button onclick="acceptFriend(${r.id})">Aceptar</button>
  </div>`;
 });
}

async function acceptFriend(id){
 await fetch('/accept-friend',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({id})
 });
 alert("Aceptado");
}

async function loadFriends(){

 const res = await fetch('/friends/'+userId);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Amigos</h2>";

 data.forEach(f=>{
  d.innerHTML+=`<div>${f.username}</div>`;
 });
}

async function rankingFriends(){

 const res = await fetch('/ranking-friends/'+userId);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Ranking Amigos</h2>";

 data.forEach((u,i)=>{
  d.innerHTML+=`<div>${i+1}. ${u.username} - ${u.total}</div>`;
 });
}

// ================= RANKING GLOBAL =================

async function loadRanking(){

 const res = await fetch('/ranking');
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Ranking Global</h2>";

 data.forEach((u,i)=>{
  d.innerHTML+=`<div>${i+1}. ${u.username} - ${u.total}</div>`;
 });
}

// ================= AUTH =================

async function register(){
 let r=await fetch('/register',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({username:user.value,password:pass.value})
 });

 if(!r.ok){
  let err=await r.json();
  alert(err.error);
  return;
 }

 alert("Usuario creado");
}

async function login(){
 let r=await fetch('/login',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({username:user.value,password:pass.value})
 });

 if(!r.ok){
  alert("Login incorrecto");
  return;
 }

 let data=await r.json();
 userId=data.id;

 document.getElementById("auth").style.display="none";
 document.getElementById("app").style.display="block";

 await load();
 render();
}

</script>
</body>
</html>
