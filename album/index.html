<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<circle cx='50' cy='50' r='50' fill='white'/>
<polygon points='50,15 65,40 35,40' fill='black'/>
</svg>">

<style>

body{
 margin:0;
 font-family:sans-serif;
 background:linear-gradient(180deg,#0b3d2e,#021e16);
 color:white;
}

/* LOGIN */
.login-container{
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}

.login-box{
 background:#063d2e;
 padding:30px;
 border-radius:10px;
 display:flex;
 flex-direction:column;
 gap:10px;
 width:250px;
 text-align:center;
}
.login-box input{
 width:100%;
 padding:10px;
 border-radius:6px;
 border:none;
 box-sizing:border-box;
}

/* HEADER */
.header{
 padding:12px;
 background:#021e16;
 border-bottom:2px solid #00e676;
 cursor:pointer;
}

/* BOTONES */
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 padding:10px;
}

button{
 background:#00e676;
 border:none;
 padding:8px;
 border-radius:6px;
 cursor:pointer;
}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
 padding:10px;
}

.card{
 background:#063d2e;
 padding:10px;
 border-radius:10px;
}

/* PROGRESS */
.bar{
 height:10px;
 background:#333;
 border-radius:5px;
 overflow:hidden;
 margin-top:5px;
}

.fill{
 height:100%;
 background:#00e676;
 width:0%;
 transition:width 0.6s ease;
}

/* DETALLE */
.group-row{
 display:flex;
 flex-wrap:wrap;
 gap:15px;
 padding:10px;
}

.team-box{
 background:#063d2e;
 padding:10px;
 border-radius:10px;
 min-width:160px;
}

.sticker{
 display:flex;
 justify-content:space-between;
 padding:3px;
 border-radius:5px;
}

.sticker.owned{
 background:#00e67633;
}

input{
 width:40px;
}

</style>
</head>

<body>

<div id="auth" class="login-container">
<div class="login-box">
<h2>⚽ Mundial 2026</h2>
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>
</div>

<div id="app" style="display:none">

<div class="header" onclick="goHome()">⚽ Mundial 2026</div>

<div class="actions">
<button onclick="buscar()">🔎 Buscar</button>
<button onclick="showMissing()">📋 Me faltan</button>
<button onclick="cambiarFiguritas()">🔄 Cambiar figuritas</button>
<button onclick="compareWithUser()">🤝 Comparar</button>

<button onclick="loadRanking()">🏆 Ranking Global</button>
<button onclick="rankingFriends()">🏆 Ranking Amigos</button>

<button onclick="searchUser()">👥 Buscar usuarios</button>
<button onclick="loadRequests()">📥 Solicitudes</button>
<button onclick="loadFriends()">👥 Amigos</button>
</div>

<div style="padding:10px;">
<h3>Progreso total</h3>
<div class="bar"><div id="totalBar" class="fill"></div></div>
<div id="totalText"></div>
</div>

<div id="groups" class="grid"></div>
<div id="detail"></div>

</div>

<script>

let userId=null;
let progressData={};

const groups={
 "Grupo A":["MEX","KOR","RSA","CZE"],
 "Grupo B":["CAN","SUI","QAT","BIH"],
 "Grupo C":["BRA","MAR","SCO","HAI"],
 "Grupo D":["USA","AUS","PAR","TUR"],
 "Grupo E":["GER","ECU","CIV","CUW"],
 "Grupo F":["NED","JPN","TUN","SWE"],
 "Grupo G":["BEL","IRN","EGY","NZL"],
 "Grupo H":["CPV","KSA","ESP","URU"],
 "Grupo I":["FRA","SEN","NOR","IRQ"],
 "Grupo J":["ALG","ARG","AUT","JOR"],
 "Grupo K":["POR","COL","UZB","COD"],
 "Grupo L":["ENG","CRO","PAN","GHA"],
 "Extras":["FWC","CC"]
};

function generate(code){
 if(code==="FWC") return Array.from({length:19},(_,i)=>"FWC-"+(i+1));
 if(code==="CC") return Array.from({length:14},(_,i)=>"CC-"+(i+1));
 return Array.from({length:20},(_,i)=>code+"-"+(i+1));
}

function goHome(){
 document.getElementById("detail").innerHTML="";
}

async function load(){
 let r=await fetch('/progress/'+userId);
 let data=await r.json();

 progressData={};
 data.forEach(x=>{
  progressData[x.sticker]={
    owned:x.owned,
    qty: x.qty ?? 0
  };
 });
}

function render(){

 let g=document.getElementById("groups");
 g.innerHTML="";

 let total=0,have=0;

 for(let k in groups){

  let all=[];
  groups[k].forEach(t=>all.push(...generate(t)));

  let owned=all.filter(s=>progressData[s]?.owned).length;

  total+=all.length;
  have+=owned;

  let percent=Math.round((owned/all.length)*100);

  g.innerHTML+=`
  <div class="card">
   <h3>${k}</h3>
   <p>${owned}/${all.length}</p>
   <div class="bar"><div class="fill" style="width:${percent}%"></div></div>
   <button onclick="openGroup('${k}')">Entrar</button>
  </div>`;
 }

 let percentTotal=Math.round((have/total)*100);
 document.getElementById("totalBar").style.width=percentTotal+"%";
 document.getElementById("totalText").innerText=`${have}/${total} (${percentTotal}%)`;
}

function openGroup(g){
 let d=document.getElementById("detail");
 d.innerHTML=`<h2>${g}</h2>`;

 let row=document.createElement("div");
 row.className="group-row";

 groups[g].forEach(t=>{
  let box=document.createElement("div");
  box.className="team-box";

  generate(t).forEach(s=>{
   let data=progressData[s]||{owned:0,qty:0};

   let item=document.createElement("div");
   item.className="sticker "+(data.owned?"owned":"");

   item.innerHTML=`
    ${s}
    <select onchange="setVal('${s}',this.value)">
      <option ${!data.owned?"selected":""}>NO</option>
      <option ${data.owned?"selected":""}>SI</option>
    </select>
    <input 
 id="qty-${s}"
 type="number" 
 value="${data.qty ?? 0}" 
 ${!data.owned?"disabled":""}
 onchange="setQty('${s}',this.value)">
   `;

   box.appendChild(item);
  });

  row.appendChild(box);
 });

 d.appendChild(row);
}

async function setVal(s,v){

 let data = progressData[s] || {qty:0};

 data.owned = v==="SI" ? 1 : 0;

 if(!data.owned){
  data.qty = 0;
 }

 progressData[s] = data;

 const input = document.getElementById("qty-"+s);

 if(input){
  input.disabled = !data.owned;

  if(!data.owned){
    input.value = 0;
  }
 }

 await save(s);
 render();
}

async function setQty(s,v){
 progressData[s].qty = parseInt(v) || 0;
 await save(s);
}

async function save(s){

 const data = progressData[s] || {};

 await fetch('/progress',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
   user_id:userId,
   sticker:s,
   owned:data.owned || 0,
   qty: data.qty ?? 0 
  })
 });
}

/* ================= FUNCIONES EXTRA ================= */

function buscar(){
 const q=prompt("Buscar");
 if(!q)return;

 let search=q.toLowerCase();

 for(let g in groups){
  for(let t of groups[g]){
   if(t.toLowerCase().includes(search)){
    openGroup(g);
    return;
   }
  }
 }

 if(search.includes("fifa")||search.includes("coca")){
  openGroup("Extras");
 }
}

function showMissing(){
 let d=document.getElementById("detail");
 d.innerHTML="<h2>Te faltan</h2>";

 for(let g in groups){
  let row=document.createElement("div");
  row.className="group-row";

  groups[g].forEach(t=>{
   let list=generate(t).filter(s=>!progressData[s]?.owned);

   if(list.length){
    let box=document.createElement("div");
    box.className="team-box";
    box.innerHTML=`<h4>${t}</h4>`;
    list.forEach(s=>box.innerHTML+=`<div>${s}</div>`);
    row.appendChild(box);
   }
  });

  d.appendChild(row);
 }
}

async function cambiarFiguritas(){
 let resFriends = await fetch('/friends/'+userId);
 let friends = await resFriends.json();

 let myDup = Object.entries(progressData)
   .filter(([k,v])=>v.qty>1)
   .map(([k])=>k);

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Cambios posibles</h2>";

 for(let f of friends){
  let r = await fetch('/progress/'+f.id);
  let data = await r.json();

  let friendData={};
  data.forEach(x=>friendData[x.sticker]=x);

  let matches = myDup.filter(s => friendData[s]?.owned);

  if(matches.length){
    d.innerHTML+=`<h3>${f.username}</h3>`;
    matches.forEach(s=>d.innerHTML+=`<div>${s}</div>`);
  }
 }
}

async function compareWithUser(){
 const other = prompt("Username");
 if(!other) return;

 const res = await fetch('/progress-user/'+other);
 if(!res.ok){alert("Usuario no existe");return;}

 const data = await res.json();

 let otherData={};
 data.forEach(x=>otherData[x.sticker]=x.owned);

 let need=[],give=[];

 for(let g in groups){
  groups[g].forEach(t=>{
    generate(t).forEach(s=>{
      if(!progressData[s]?.owned && otherData[s]) need.push(s);
      if(progressData[s]?.owned && !otherData[s]) give.push(s);
    });
  });
 }

 let d=document.getElementById("detail");

 d.innerHTML=`
 <h2>Comparación</h2>
 <h3>Vos no tenés y él sí</h3>
 ${need.map(s=>`<div>${s}</div>`).join("")}
 <h3>Él no tiene y vos sí</h3>
 ${give.map(s=>`<div>${s}</div>`).join("")}
 `;
}

/* ================= AMIGOS ================= */

async function searchUser(){
 const name = prompt("Buscar usuario");
 if(!name) return;

 const res = await fetch('/search/'+name);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Resultados</h2>";

 data.forEach(u=>{
  d.innerHTML+=`
  <div>
   ${u.username}
   <button onclick="addFriend(${u.id})">Agregar</button>
  </div>`;
 });
}

async function addFriend(id){
 await fetch('/add-friend',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({user_id:userId,friend_id:id})
 });
 alert("Solicitud enviada");
}

async function loadRequests(){
 const res = await fetch('/requests/'+userId);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Solicitudes</h2>";

 data.forEach(r=>{
  d.innerHTML+=`
  <div>
   ${r.username}
   <button onclick="acceptFriend(${r.id})">Aceptar</button>
  </div>`;
 });
}

async function acceptFriend(id){
 await fetch('/accept-friend',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({id})
 });
 alert("Aceptado");
}

async function loadFriends(){
 const res = await fetch('/friends/'+userId);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Amigos</h2>";

 data.forEach(f=>{
  d.innerHTML+=`<div>${f.username}</div>`;
 });
}

async function rankingFriends(){
 const res = await fetch('/ranking-friends/'+userId);
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Ranking Amigos</h2>";

 data.forEach((u,i)=>{
  d.innerHTML+=`<div>${i+1}. ${u.username} - ${u.total}</div>`;
 });
}

async function loadRanking(){
 const res = await fetch('/ranking');
 const data = await res.json();

 let d=document.getElementById("detail");
 d.innerHTML="<h2>Ranking Global</h2>";

 data.forEach((u,i)=>{
  d.innerHTML+=`<div>${i+1}. ${u.username} - ${u.total}</div>`;
 });
}

/* ================= AUTH ================= */

async function login(){
 let r=await fetch('/login',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({username:user.value,password:pass.value})
 });

 if(!r.ok){alert("Error login");return;}

 let data=await r.json();
 userId=data.id;
 if(!userId){
 alert("Error: userId no definido");
 return;
}

 document.getElementById("auth").style.display="none";
 document.getElementById("app").style.display="block";

 await load();
 render();
}

async function register(){
 await fetch('/register',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({username:user.value,password:pass.value})
 });
 alert("Usuario creado");
}

</script>

</body>
</html>
